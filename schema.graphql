# API v3 schema, copied from ledger-api-v3
# src/main/resources/graphql/schema.graphqls (local main, 2026-10-19).
# Refresh by hand when the backend schema changes.
# CategoryType: ledger-api-v3 main@9f27aad (local, 2026-10-23).
#
type Query {
    accounts(first: Int!, after: String, sort: [OrderInput!]): AccountConnection!
    account(id: ID!): Account!
    categories(first: Int!, after: String, sort: [OrderInput!]): CategoryConnection!
    category(id: ID!): Category
    transactions(first: Int!, after: String, sort: [OrderInput!], filter: TransactionFilter): TransactionConnection!
    transaction(id: ID!): Transaction!
}

type Mutation {
    initializeUser: Boolean
    createAccount(name: String!, balance: MoneyInput!): Account!
    deleteAccount(id: ID!): ID!
    patchAccount(id: ID!, name: String, balance: MoneyInput): Account!
    createCategory(name: String!, type: CategoryType = ANY): Category!
    deleteCategory(id: ID!): ID!
    patchCategory(id: ID!, name: String, type: CategoryType): Category!
    withdraw(fromAccountId: ID!, amount: MoneyInput!, categoryId: ID, description: String, occurredAt: String): Expense!
    deposit(toAccountId: ID!, amount: MoneyInput!, categoryId: ID, description: String, occurredAt: String): Income!
    transfer(fromAccountId: ID!, toAccountId: ID!, amount: MoneyInput!, convertedAmount: MoneyInput, categoryId: ID, description: String, occurredAt: String): Transfer
    deleteTransaction(id: ID!): ID!
    patchExpense(id: ID!, fromAccountId: ID, amount: MoneyInput, categoryId: ID, description: String, occurredAt: String): Expense!
    patchIncome(id: ID!, toAccountId: ID, amount: MoneyInput, categoryId: ID, description: String, occurredAt: String): Income!
    patchTransfer(id: ID!, fromAccountId: ID, toAccountId: ID, amount: MoneyInput, convertedAmount: MoneyInput, categoryId: ID, description: String, occurredAt: String): Transfer!
}

enum Currency {
    USD
    THB
    EUR
    JPY
}

type Money {
    amount: Float!
    currency: Currency!
}

type Account {
    id: ID!
    name: String!
    balance: Money!
}

enum CategoryType {
    ANY
    EXPENSE
    INCOME
    TRANSFER
}

type Category {
    id: ID!
    name: String!
    type: CategoryType!
}

interface Transaction {
    id: ID!
    amount: Money!
    category: Category
    description: String
    occurredAt: String!
}

type Expense implements Transaction {
    id: ID!
    amount: Money!
    from: Account!
    category: Category
    description: String
    occurredAt: String!
}

type Income implements Transaction {
    id: ID!
    amount: Money!
    to: Account!
    category: Category
    description: String
    occurredAt: String!
}

type Transfer implements Transaction {
    id: ID!
    amount: Money!
    from: Account!
    to: Account!
    convertedAmount: Money
    category: Category
    description: String
    occurredAt: String!
}

## Input

input MoneyInput {
    amount: Float!
    currency: Currency!
}

enum TransactionType {
    EXPENSE
    INCOME
    TRANSFER
}

input TransactionFilter {
    fromDate: String
    toDate: String
    categoryId: ID
    accountId: ID
    type: TransactionType
}

enum SortDirection {
    ASC
    DESC
}

input OrderInput {
    property: String!
    direction: SortDirection!
}

## Generated by Spring for GraphQL at runtime (not in schema.graphqls)

type PageInfo {
    hasPreviousPage: Boolean!
    hasNextPage: Boolean!
    startCursor: String
    endCursor: String
}

type AccountConnection {
    edges: [AccountEdge]!
    pageInfo: PageInfo!
}

type AccountEdge {
    node: Account!
    cursor: String!
}

type CategoryConnection {
    edges: [CategoryEdge]!
    pageInfo: PageInfo!
}

type CategoryEdge {
    node: Category!
    cursor: String!
}

type TransactionConnection {
    edges: [TransactionEdge]!
    pageInfo: PageInfo!
}

type TransactionEdge {
    node: Transaction!
    cursor: String!
}
